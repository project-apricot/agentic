version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      mcp:
        patterns:
          - "ModelContextProtocol*"
      grpc:
        patterns:
          - "Grpc.*"
          - "Google.Protobuf"
      apricot-framework:
        patterns:
          - "ApricotFramework.*"
    ignore:
      - dependency-name: "xunit*"
      - dependency-name: "Microsoft.AspNetCore.TestHost"
      - dependency-name: "Microsoft.NET.Test.Sdk"
      - dependency-name: "coverlet.*"
      - dependency-name: "Microsoft.Testing.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
